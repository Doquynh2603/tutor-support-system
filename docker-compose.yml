version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: tutor-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: tutor_support_system
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - tutor-network

  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tutor-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: YourStrong@Passw0rd
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - tutor-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: tutor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - tutor-network
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutor-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/tutor_support_system
      MSSQL_HOST: sqlserver
      MSSQL_PORT: 1433
      MSSQL_DATABASE: tutor_support_system
      MSSQL_USER: sa
      MSSQL_PASSWORD: YourStrong@Passw0rd
      MSSQL_ENCRYPT: "true"
      MSSQL_TRUST_SERVER_CERTIFICATE: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost
      SOCKET_CORS_ORIGIN: http://localhost
    depends_on:
      - mongodb
      - sqlserver
      - redis
    networks:
      - tutor-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tutor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tutor-network

networks:
  tutor-network:
    driver: bridge

volumes:
  mongodb_data:
  sqlserver_data:
  redis_data:
